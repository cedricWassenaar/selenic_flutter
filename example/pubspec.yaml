name: example
description: Showcase Selenic Design.
publish_to: none
version: 2.0.0
environment:
  sdk: '>=3.3.1 <4.0.0'
dependencies:
  cupertino_icons: ^1.0.2
  device_frame: ^1.4.0
  device_preview: ^1.3.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.1.0
  package_info_plus: ^9.0.0
  selenic_design:
    path: ../
  storybook_flutter: ^0.14.1
  transparent_image: ^2.0.1
  url_launcher: ^6.0.9
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lint: ^2.1.2
flutter:
  uses-material-design: true
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/DMSans.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/RobotoMono-Regular.ttf
  assets:
    - assets/code_snippets/
    - assets/components/
    - assets/images/
    - assets/svg/
